name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the unit tests are TypeScript run by node --test directly, which
          # needs a Node that strips types by itself (22.18+); 20 cannot.
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: container build (sanity)
        run: docker build -t katalog-manager-ui:ci .
