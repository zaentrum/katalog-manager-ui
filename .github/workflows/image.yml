name: image

# Build the container and publish it to the GitHub Container Registry
# (ghcr.io/zaentrum/katalog-manager-ui). The OKD demo pulls images from here.
on:
  push:
    branches: [main]
    # A release: the tag vX.Y.Z publishes the image as :vX.Y.Z and :X.Y.
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the unit tests are TypeScript run by node --test directly, which
          # needs a Node that strips types by itself (22.18+); 20 cannot.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Before the image: a failing test publishes nothing.
      - name: Unit tests
        run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main publishes :latest and :<commit>. A release tag publishes :vX.Y.Z
      # and :X.Y (no :X.Y for a pre-release such as v1.2.0-rc.1), and leaves
      # :latest where main put it.
      - name: Tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$IMAGE:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in
              *-*) ;;
              *) v="${GITHUB_REF_NAME#v}"; tags="$tags,$IMAGE:${v%.*}" ;;
            esac
          else
            tags="$IMAGE:latest,$IMAGE:$GITHUB_SHA"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
