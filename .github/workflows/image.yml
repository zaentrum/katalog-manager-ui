name: image

# Build the container and publish it to the GitHub Container Registry
# (ghcr.io/zaentrum/katalog-manager-ui). The OKD demo pulls images from here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24: the unit tests are TypeScript run by node --test directly, which
          # needs a Node that strips types by itself (22.18+); 20 cannot.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Before the image: a failing test publishes nothing.
      - name: Unit tests
        run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
